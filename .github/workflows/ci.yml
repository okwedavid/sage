# SAGE CI — Continuous Integration
#
# Runs on every push and pull request. Enforces:
#   - Build (backend tsc emit + frontend next build)
#   - Lint (backend eslint + frontend next lint)
#   - Tests (vitest, full suite)
#   - Coverage thresholds (enforced by vitest.config.ts)
#   - Typecheck (app + test files)
#   - Security audit (npm audit, production deps)
#   - Deployment preparation (Docker image build, artifact upload)
#
# NOTE: This workflow NEVER deploys automatically. Deployment is gated on
# human approval (see deploy job, which is workflow_dispatch + environment).

name: CI

on:
  push:
    branches: [main, release/**, feature/**]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  BACKEND_PATH: backend
  FRONTEND_PATH: frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BACKEND — typecheck, lint, test, coverage, audit
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (typecheck · lint · test · coverage · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_PATH }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKEND_PATH }}/node_modules
          key: backend-nm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Coverage (thresholds enforced)
        run: npm run test:coverage

      - name: Build (tsc emit)
        run: npm run build

      - name: Security audit (production deps)
        run: npm audit --omit=dev
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────
  # 2. FRONTEND — typecheck, lint, build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ env.FRONTEND_PATH }}/node_modules
          key: frontend-nm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. DEPLOYMENT PREPARATION — build deployable artifact,
  #    do NOT deploy. Uploads Docker image + metadata for a human
  #    to review/approve before any production action.
  # ─────────────────────────────────────────────────────────────
  deploy-prep:
    name: Deployment preparation (no auto-deploy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production build scripts
        run: |
          test -f backend/railway.json && echo "railway.json present"
          test -f backend/package.json && echo "backend manifest present"
          test -f frontend/next.config.js && echo "next config present"

      - name: Build backend Docker image (verification only)
        run: |
          echo "::notice::Deploy image build is DISABLED by default (no registry credentials)."
          echo "Enable by adding DOCKER_REGISTRY / DOCKER_* secrets and a deploy job."

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-metadata
          path: |
            backend/railway.json
            DEPLOYMENT_GUIDE.md
            CHANGELOG.md
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 4. DEPLOY (OPT-IN, HUMAN-GATED)
  #
  # Disabled by default. To enable production deploys through CI:
  #   1. Add a GitHub environment named "production" with required
  #      reviewers (Settings → Environments).
  #   2. Add the needed secrets (e.g. RAILWAY_TOKEN or VERCEL_TOKEN
  #      + project IDs).
  #   3. Trigger manually: Actions → "Deploy" → Run workflow.
  # The environment gate guarantees human approval before deploy.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (manual · human-approved)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show required-but-unset credentials (do not deploy)
        run: |
          echo "::warning::Deploy job requires human-approved credentials."
          echo "If RAILWAY_TOKEN is not configured, this step is informational only."
          echo "RAILWAY_TOKEN set: ${{ secrets.RAILWAY_TOKEN != '' }}"

      - name: Deploy backend to Railway
        if: secrets.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Railway deployment would run here (npx @railway/cli up)."
          echo "Not executed — credentials gated behind human approval."

      - name: Deploy frontend to Vercel
        if: secrets.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Vercel deployment would run here (vercel --prod)."
          echo "Not executed — credentials gated behind human approval."

  # ─────────────────────────────────────────────────────────────
  # 5. STATUS GATE — single "CI" check for branch protection
  # ─────────────────────────────────────────────────────────────
  status:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "✅ CI passed: backend + frontend"
          else
            echo "❌ CI failed"
            exit 1
          fi
